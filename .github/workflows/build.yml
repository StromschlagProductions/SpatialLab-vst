name: Build and test
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'Tools/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      full_windows:
        description: 'Complete Windows VST3, GUI captures, measurements and installation package'
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-vst3:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_windows) || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned CMake
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --target .ci-tools cmake==3.31.6
          "$pwd/.ci-tools/cmake/data/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Originalgrafiken, öffentliche Verträge und eingefrorene DSP-Referenzen prüfen
        run: |
          python Tools/check_episode_artwork.py
          python Tools/check_protected_audio.py
          python Tools/check_classic_scope.py
      - name: Configure (JUCE 8.0.6, VS 2022 x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build VST3 and tests
        run: cmake --build build --config Release --parallel 2
      - name: Hersteller und Plugin-Identität am gebauten Modul verifizieren
        run: python Tools/check_vst3_manufacturer.py build/SpatialLab_artefacts/Release/VST3/SpatialLab.vst3/Contents/Resources/moduleinfo.json build/SpatialLab.vcxproj
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure | Tee-Object -FilePath build/ctest-results.txt
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
      - name: pluginval 1.0.4 strictness level 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/pluginval | Out-Null
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile build/pluginval.zip
          if ((Get-FileHash build/pluginval.zip -Algorithm SHA256).Hash.ToLower() -ne "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab") { throw "pluginval checksum mismatch" }
          Expand-Archive build/pluginval.zip build/pluginval-tool
          & build/pluginval-tool/pluginval.exe --strictness-level 8 --validate "$pwd/build/SpatialLab_artefacts/Release/VST3/SpatialLab.vst3" --output-dir "$pwd/build/pluginval" 2>&1 | Tee-Object build/pluginval/stdout.txt
          if ($LASTEXITCODE -ne 0) { throw "pluginval level 8 failed" }
      - name: Preserve pluginval reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SpatialLab-Classic-pluginval
          path: build/pluginval/
          if-no-files-found: ignore
      - name: Capture all looks with the actual editor
        shell: pwsh
        run: |
          foreach ($look in 0..2) {
            $folder = "build/classic-screens/Look-$look"
            $preview = Start-Process -FilePath "build/SpatialLabGuiPreview_artefacts/Release/SpatialLab GUI Preview.exe" -ArgumentList "--output=$folder", "--look=$look", "--silent" -PassThru
            if (-not $preview.WaitForExit(120000)) { $preview.Kill(); throw "Look capture timed out" }
            if ($preview.ExitCode -ne 0) { throw "Look capture failed" }
            python Tools/validate_gui_capture.py $folder 1504x846
            if ($LASTEXITCODE -ne 0) { throw "Look capture validation failed" }
          }
          $folder = "build/classic-screens/Retro-Episode-I"
          $preview = Start-Process -FilePath "build/SpatialLabGuiPreview_artefacts/Release/SpatialLab GUI Preview.exe" -ArgumentList "--output=$folder", "--look=0", "--episode=I", "--silent" -PassThru
          if (-not $preview.WaitForExit(120000)) { $preview.Kill(); throw "Episode I capture timed out" }
          if ($preview.ExitCode -ne 0) { throw "Episode I capture failed" }
          python Tools/validate_gui_capture.py $folder 1504x846
          if ($LASTEXITCODE -ne 0) { throw "Episode I validation failed" }
          python Tools/check_branding_capture.py build/classic-screens
          if ($LASTEXITCODE -ne 0) { throw "Capture branding mismatch" }
      - name: Upload Classic and Retro look screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SpatialLab-Classic-Looks
          path: build/classic-screens/
          if-no-files-found: error
      - name: Capture real large editors and silent/audio animation sequences
        shell: pwsh
        run: |
          foreach ($episode in @("I", "IV")) {
            foreach ($size in @("1504x846", "1672x941")) {
              foreach ($mode in @("Silent", "Audio")) {
                $folder = "build/gui-preview/Episode-$episode/$size/$mode"
                $previewArgs = @("--output=$folder", "--episode=$episode", "--size=$size", "--sequence")
                if ($mode -eq "Silent") { $previewArgs += "--silent" }
                $preview = Start-Process -FilePath "build/SpatialLabGuiPreview_artefacts/Release/SpatialLab GUI Preview.exe" -ArgumentList $previewArgs -PassThru
                if (-not $preview.WaitForExit(120000)) { $preview.Kill(); throw "GUI capture timed out" }
                if ($preview.ExitCode -ne 0) { throw "GUI capture failed" }
                python Tools/validate_gui_capture.py $folder $size
                if ($LASTEXITCODE -ne 0) { throw "PNG validation failed" }
              }
            }
          }
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python Tools/check_lighting_capture.py build/gui-preview
          if ($LASTEXITCODE -ne 0) { throw "Visible animation verification failed" }
      - name: Capture all 26 environments in both Episode skins
        shell: pwsh
        run: |
          foreach ($episode in @("I", "IV")) {
            foreach ($room in 0..25) {
              $folder = "build/environment-screens/Episode-$episode/Room-$room"
              $preview = Start-Process -FilePath "build/SpatialLabGuiPreview_artefacts/Release/SpatialLab GUI Preview.exe" -ArgumentList "--output=$folder", "--episode=$episode", "--room=$room", "--silent" -PassThru
              if (-not $preview.WaitForExit(120000)) { $preview.Kill(); throw "Capture timed out" }
              if ($preview.ExitCode -ne 0) { throw "Capture failed" }
              python Tools/validate_gui_capture.py $folder 1504x846
              if ($LASTEXITCODE -ne 0) { throw "Invalid PNG" }
            }
          }
      - name: Capture maximum-size editors, report desktop limits honestly
        shell: pwsh
        run: |
          foreach ($episode in @("I", "IV")) {
            $folder = "build/maximum-screens/Episode-$episode"
            $preview = Start-Process -FilePath "build/SpatialLabGuiPreview_artefacts/Release/SpatialLab GUI Preview.exe" -ArgumentList "--output=$folder", "--episode=$episode", "--size=2174x1223", "--silent", "--allow-render-only" -PassThru
            if (-not $preview.WaitForExit(120000)) { $preview.Kill(); throw "Maximum capture timed out" }
            if ($preview.ExitCode -ne 0) { throw "Maximum capture failed" }
            if (-not (Test-Path "$folder/JUCE-Editor-Render-100.png")) { throw "Maximum component render missing" }
          }
      - name: Upload maximum-size evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SpatialLab-Phase3B-Maximum-GUI
          path: build/maximum-screens/
          if-no-files-found: error
      - name: Measure and export all environment impulse responses
        shell: pwsh
        run: |
          ./build/Release/SpatialLabEnvironmentTests.exe build/environment-ir | Tee-Object -FilePath build/environments.csv
          if ($LASTEXITCODE -ne 0) { throw "Environment IR tests failed" }
      - name: Upload all 52 native GUI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-Phase3B-Screenshots
          path: build/environment-screens/**/Windows-Editor-Screenshot.png
          if-no-files-found: error
      - name: Upload reproducible impulse responses and voicing data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-Phase3B-IR-Messungen
          path: |
            build/environment-ir/
            build/environments.csv
            docs/phase3b/
          if-no-files-found: error
      - name: Preserve real GUI diagnostics if capture verification fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-GUI-Capture-Diagnostics
          path: build/gui-preview/
          if-no-files-found: ignore
      - name: Historische Phase-1/Phase-2-Raumabstimmung am eingefrorenen Vorgänger prüfen
        shell: pwsh
        run: |
          ./build/Release/SpatialLabRoomComparison.exe build/room-comparison | Tee-Object -FilePath build/room-comparison.csv
          if ($LASTEXITCODE -ne 0) { throw "Room comparison failed" }
      - name: Diagnose bass and neutral early/late transfer
        shell: pwsh
        run: ./build/Release/SpatialLabRoomDiagnostics.exe | Out-File build/room-diagnostics.csv -Encoding utf8
      - name: Profile DSP at 44.1 and 48 kHz (informational)
        shell: pwsh
        run: ./build/Release/SpatialLabDspBenchmark.exe | Tee-Object -FilePath build/dsp-benchmark.csv
      - name: Record toolchain
        shell: pwsh
        run: |
          cmake --version | Out-File build/toolchain.txt
          Get-Content build/CMakeCache.txt | Select-String 'CMAKE_(CXX_COMPILER|CXX_COMPILER_VERSION|GENERATOR):' | Out-File build/toolchain.txt -Append
          git rev-parse HEAD | Out-File build/toolchain.txt -Append
      - name: Installations-ZIP mit genau einem VST3-Ordner packen
        shell: pwsh
        run: |
          $bundle = "build/SpatialLab_artefacts/Release/VST3/SpatialLab.vst3"
          if (-not (Test-Path $bundle)) { throw "SpatialLab.vst3 fehlt" }
          Compress-Archive -Path $bundle -DestinationPath "SpatialLab-VST3-Windows.zip" -Force
      - name: Record exact tested build inputs and package checksum
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,os,re
          inputs=['Source','Tests','Tools','assets','cmake','CMakeLists.txt','.github/workflows/build.yml']
          tree=subprocess.check_output(['git','ls-tree','-r','HEAD','--',*inputs])
          package=pathlib.Path('SpatialLab-VST3-Windows.zip')
          version=re.search(r'project\(SpatialLab VERSION ([0-9.]+)',pathlib.Path('CMakeLists.txt').read_text())[1]
          manifest={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'run_id':os.environ['GITHUB_RUN_ID'],'version':version,'public_version':('.'.join(version.split('.')[:2]) if version.endswith('.0') else version),
            'build_inputs_sha256':hashlib.sha256(tree).hexdigest(),
            'package_sha256':hashlib.sha256(package.read_bytes()).hexdigest()}
          pathlib.Path('build/acceptance-provenance.json').write_text(json.dumps(manifest,indent=2))
      - name: Upload acceptance provenance and test summaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SpatialLab-Acceptance-Provenance
          path: |
            build/acceptance-provenance.json
            build/ctest-results.txt
          if-no-files-found: error
      - name: Sauberes Windows-VST3-Installationspaket hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-VST3-Windows-Installieren
          path: SpatialLab-VST3-Windows.zip
          if-no-files-found: error
      - name: Upload VST3 bundle and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-Windows-x64-${{ github.sha }}
          path: |
            build/SpatialLab_artefacts/Release/VST3/SpatialLab.vst3
            build/toolchain.txt
            build/dsp-benchmark.csv
            build/gui-preview/**/Windows-Editor-Screenshot.png
            build/gui-preview/lighting-visibility.json
            build/environment-screens/**/Windows-Editor-Screenshot.png
            build/environment-ir/
            build/environments.csv
            build/room-comparison/
            build/room-comparison.csv
            build/room-diagnostics.csv
            build/ctest-results.txt
          if-no-files-found: error
  dsp-sanitizers:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned CMake
        run: |
          python3 -m pip install --target .ci-tools cmake==3.31.6
          echo "$PWD/.ci-tools/cmake/data/bin" >> "$GITHUB_PATH"
      - name: Configure DSP tests with ASan and UBSan
        run: >-
          cmake -S . -B build -DSPATIALLAB_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel 2
      - name: Complete sanitizer suite for explicit acceptance
        run: ctest --test-dir build --output-on-failure

  acoustic-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned offline measurement tools
        run: |
          python3 -m venv .audit-venv
          .audit-venv/bin/pip install cmake==3.31.6 numpy==2.3.5
          if ! ffmpeg -hide_banner -filters > /tmp/flite-filters.txt 2>/dev/null; then true; fi
          if ! grep -q flite /tmp/flite-filters.txt; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Compile both real DSP versions with identical Release settings
        run: |
          .audit-venv/bin/cmake -S . -B build-audit -DSPATIALLAB_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          .audit-venv/bin/cmake --build build-audit --target SpatialLabWetLevelAudit SpatialLabAcousticV13 SpatialLabAcousticAudit SpatialLabAcousticBaseline SpatialLabDspBenchmark SpatialLabBaselineBenchmark --parallel 2
      - name: Preserve historical Issue-6 comparison against frozen v1.3 acoustics
        run: |
          .audit-venv/bin/python Tools/issue6_source.py build-audit/source
          git rev-parse HEAD > build-audit/tested-commit.txt
          build-audit/SpatialLabAcousticBaseline build-audit/before build-audit/source/speech.f32
          build-audit/SpatialLabAcousticV13 build-audit/after build-audit/source/speech.f32
          .audit-venv/bin/python Tools/acoustic_audit.py build-audit/before --source build-audit/source/speech.f32 --wav
          .audit-venv/bin/python Tools/acoustic_audit.py build-audit/after --source build-audit/source/speech.f32 --wav
          .audit-venv/bin/python Tools/compare_acoustic_audit.py build-audit
      - name: Measure v1.4 gains and render unnormalized speech mixes at both target rates
        run: |
          .audit-venv/bin/python Tools/wet_level_source.py build-audit/wet-levels/source
          build-audit/SpatialLabWetLevelAudit build-audit/wet-levels build-audit/wet-levels/source
          .audit-venv/bin/python Tools/compare_wet_levels.py build-audit/wet-levels
      - name: Upload v1.3 versus v1.4 measurements and listening WAVs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SpatialLab-v1.4-Wet-Level-Comparison
          retention-days: 14
          path: build-audit/wet-levels/
          if-no-files-found: error
      - name: Measure before and after CPU serially (informational)
        run: |
          build-audit/SpatialLabBaselineBenchmark > build-audit/cpu-before.csv
          build-audit/SpatialLabDspBenchmark > build-audit/cpu-after.csv
      - name: Upload measurements and actual-DSP listening files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SpatialLab-Issue6-Acoustic-Audit
          retention-days: 14
          path: |
            build-audit/source/
            build-audit/before/*.csv
            build-audit/before/*.json
            build-audit/before/*.wav
            build-audit/after/*.csv
            build-audit/after/*.json
            build-audit/after/*.wav
            build-audit/COMPARISON.md
            build-audit/tested-commit.txt
            build-audit/cpu-before.csv
            build-audit/cpu-after.csv
          if-no-files-found: error
