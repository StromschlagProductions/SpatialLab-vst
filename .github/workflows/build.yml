name: Build and test
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'Tools/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      full_windows:
        description: 'Complete Windows VST3, GUI captures, measurements and installation package'
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-vst3:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_windows) || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned CMake
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --target .ci-tools cmake==3.31.6
          "$pwd/.ci-tools/cmake/data/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Originalgrafiken und Phase-2-Audio bytegenau unverändert prüfen
        run: |
          python Tools/check_episode_artwork.py
          python Tools/check_protected_audio.py
      - name: Configure (JUCE 8.0.6, VS 2022 x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build VST3 and tests
        run: cmake --build build --config Release --parallel 2
      - name: Hersteller und Plugin-Identität am gebauten Modul verifizieren
        run: python Tools/check_vst3_manufacturer.py build/SpatialLab_artefacts/Release/VST3/SpatialLab.vst3/Contents/Resources/moduleinfo.json build/SpatialLab.vcxproj
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure | Tee-Object -FilePath build/ctest-results.txt
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
      - name: Capture real large editors and silent/audio animation sequences
        shell: pwsh
        run: |
          foreach ($episode in @("I", "IV")) {
            foreach ($size in @("1504x846", "1672x941")) {
              foreach ($mode in @("Silent", "Audio")) {
                $folder = "build/gui-preview/Episode-$episode/$size/$mode"
                $previewArgs = @("--output=$folder", "--episode=$episode", "--size=$size", "--sequence")
                if ($mode -eq "Silent") { $previewArgs += "--silent" }
                $preview = Start-Process -FilePath "build/SpatialLabGuiPreview_artefacts/Release/SpatialLab GUI Preview.exe" -ArgumentList $previewArgs -PassThru
                if (-not $preview.WaitForExit(120000)) { $preview.Kill(); throw "GUI capture timed out" }
                if ($preview.ExitCode -ne 0) { throw "GUI capture failed" }
                python Tools/validate_gui_capture.py $folder $size
                if ($LASTEXITCODE -ne 0) { throw "PNG validation failed" }
              }
            }
          }
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python Tools/check_lighting_capture.py build/gui-preview
          if ($LASTEXITCODE -ne 0) { throw "Visible animation verification failed" }
      - name: Capture all 26 environments in both Episode skins
        shell: pwsh
        run: |
          foreach ($episode in @("I", "IV")) {
            foreach ($room in 0..25) {
              $folder = "build/environment-screens/Episode-$episode/Room-$room"
              $preview = Start-Process -FilePath "build/SpatialLabGuiPreview_artefacts/Release/SpatialLab GUI Preview.exe" -ArgumentList "--output=$folder", "--episode=$episode", "--room=$room", "--silent" -PassThru
              if (-not $preview.WaitForExit(120000)) { $preview.Kill(); throw "Capture timed out" }
              if ($preview.ExitCode -ne 0) { throw "Capture failed" }
              python Tools/validate_gui_capture.py $folder 1504x846
              if ($LASTEXITCODE -ne 0) { throw "Invalid PNG" }
            }
          }
      - name: Capture maximum-size editors, report desktop limits honestly
        shell: pwsh
        run: |
          foreach ($episode in @("I", "IV")) {
            $folder = "build/maximum-screens/Episode-$episode"
            $preview = Start-Process -FilePath "build/SpatialLabGuiPreview_artefacts/Release/SpatialLab GUI Preview.exe" -ArgumentList "--output=$folder", "--episode=$episode", "--size=2174x1223", "--silent", "--allow-render-only" -PassThru
            if (-not $preview.WaitForExit(120000)) { $preview.Kill(); throw "Maximum capture timed out" }
            if ($preview.ExitCode -ne 0) { throw "Maximum capture failed" }
            if (-not (Test-Path "$folder/JUCE-Editor-Render-100.png")) { throw "Maximum component render missing" }
          }
      - name: Upload maximum-size evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SpatialLab-Phase3B-Maximum-GUI
          path: build/maximum-screens/
          if-no-files-found: error
      - name: Measure and export all environment impulse responses
        shell: pwsh
        run: |
          ./build/Release/SpatialLabEnvironmentTests.exe build/environment-ir | Tee-Object -FilePath build/environments.csv
          if ($LASTEXITCODE -ne 0) { throw "Environment IR tests failed" }
      - name: Upload all 52 native GUI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-Phase3B-Screenshots
          path: build/environment-screens/**/Windows-Editor-Screenshot.png
          if-no-files-found: error
      - name: Upload reproducible impulse responses and voicing data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-Phase3B-IR-Messungen
          path: |
            build/environment-ir/
            build/environments.csv
            docs/phase3b/
          if-no-files-found: error
      - name: Preserve real GUI diagnostics if capture verification fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-GUI-Capture-Diagnostics
          path: build/gui-preview/
          if-no-files-found: ignore
      - name: Alte und neue Raum-Impulsantworten bei beiden Zielraten vergleichen
        shell: pwsh
        run: |
          ./build/Release/SpatialLabRoomComparison.exe build/room-comparison | Tee-Object -FilePath build/room-comparison.csv
          if ($LASTEXITCODE -ne 0) { throw "Room comparison failed" }
      - name: Diagnose bass and neutral early/late transfer
        shell: pwsh
        run: ./build/Release/SpatialLabRoomDiagnostics.exe | Out-File build/room-diagnostics.csv -Encoding utf8
      - name: Profile DSP at 44.1 and 48 kHz (informational)
        shell: pwsh
        run: ./build/Release/SpatialLabDspBenchmark.exe | Tee-Object -FilePath build/dsp-benchmark.csv
      - name: Record toolchain
        shell: pwsh
        run: |
          cmake --version | Out-File build/toolchain.txt
          Get-Content build/CMakeCache.txt | Select-String 'CMAKE_(CXX_COMPILER|CXX_COMPILER_VERSION|GENERATOR):' | Out-File build/toolchain.txt -Append
          git rev-parse HEAD | Out-File build/toolchain.txt -Append
      - name: Installations-ZIP mit genau einem VST3-Ordner packen
        shell: pwsh
        run: |
          $bundle = "build/SpatialLab_artefacts/Release/VST3/SpatialLab.vst3"
          if (-not (Test-Path $bundle)) { throw "SpatialLab.vst3 fehlt" }
          Compress-Archive -Path $bundle -DestinationPath "SpatialLab-VST3-Windows.zip" -Force
      - name: Sauberes Windows-VST3-Installationspaket hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-VST3-Windows-Installieren
          path: SpatialLab-VST3-Windows.zip
          if-no-files-found: error
      - name: Upload VST3 bundle and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpatialLab-Windows-x64-${{ github.sha }}
          path: |
            build/SpatialLab_artefacts/Release/VST3/SpatialLab.vst3
            build/toolchain.txt
            build/dsp-benchmark.csv
            build/gui-preview/**/Windows-Editor-Screenshot.png
            build/gui-preview/lighting-visibility.json
            build/environment-screens/**/Windows-Editor-Screenshot.png
            build/environment-ir/
            build/environments.csv
            build/room-comparison/
            build/room-comparison.csv
            build/room-diagnostics.csv
            build/ctest-results.txt
          if-no-files-found: error
  dsp-sanitizers:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned CMake
        run: |
          python3 -m pip install --target .ci-tools cmake==3.31.6
          echo "$PWD/.ci-tools/cmake/data/bin" >> "$GITHUB_PATH"
      - name: Configure DSP tests with ASan and UBSan
        run: >-
          cmake -S . -B build -DSPATIALLAB_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel 2
      - name: Complete sanitizer suite for explicit acceptance
        run: ctest --test-dir build --output-on-failure
